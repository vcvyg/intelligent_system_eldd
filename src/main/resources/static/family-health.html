<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康数据详情 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/family-mobile.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        .health-detail-container {
            padding: 30px;
        }

        .health-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--color-border);
        }

        .health-header h2 {
            margin: 0;
            font-size: 24px;
            color: var(--color-text-dark);
        }

        .health-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .health-card {
            background: var(--color-bg-lighter);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        .health-card .label {
            font-size: 14px;
            color: var(--color-text-gray);
            margin-bottom: 10px;
        }

        .health-card .value {
            font-size: 32px;
            font-weight: bold;
            color: var(--color-primary);
            margin-bottom: 5px;
        }

        .health-card .unit {
            font-size: 12px;
            color: var(--color-text-light);
        }

        .health-card .status {
            margin-top: 10px;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: var(--radius-xl);
            display: inline-block;
        }

        .status-normal {
            background: var(--color-success);
            color: white;
        }

        .status-abnormal {
            background: var(--color-danger);
            color: white;
        }

        .chart-section {
            background: var(--color-bg-lighter);
            padding: 25px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }

        .chart-section h3 {
            margin: 0 0 20px 0;
            font-size: 18px;
            color: var(--color-text-dark);
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .data-table-section {
            margin-top: 30px;
        }
    </style>
</head>
<body data-family-nav="dashboard">
    <div class="admin-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">子女端</p>
            </div>
            <nav class="nav-menu">
                <a href="family-dashboard.html" class="nav-item">
                    <span class="icon">📊</span>
                    <span>家人数据总览</span>
                </a>
                <a href="family-chat.html" class="nav-item">
                    <span class="icon">💬</span>
                    <span>沟通通道</span>
                </a>
                <a href="family-location.html" class="nav-item">
                    <span class="icon">📍</span>
                    <span>GPS定位</span>
                </a>
                <a href="family-services.html" class="nav-item">
                    <span class="icon">🏥</span>
                    <span>医护服务</span>
                </a>
                <a href="family-me.html" class="nav-item">
                    <span class="icon">👤</span>
                    <span>账号中心</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <h1>健康数据详情</h1>
                <div class="user-info">
                    <button class="btn-secondary" onclick="window.location.href='family-dashboard.html'">返回</button>
                </div>
            </header>

            <div class="health-detail-container">
                <!-- 老人信息头部 -->
                <div class="health-header">
                    <h2 id="elderlyName">加载中...</h2>
                    <div>
                        <select id="daysSelect" class="btn-secondary" onchange="loadHealthData()">
                            <option value="7">近7天</option>
                            <option value="14">近14天</option>
                            <option value="30">近30天</option>
                        </select>
                    </div>
                </div>

                <!-- 最新健康数据卡片 -->
                <div class="health-cards" id="latestHealthCards">
                    <!-- 动态加载 -->
                </div>

                <!-- 趋势图表 -->
                <div class="chart-section">
                    <h3>心率趋势</h3>
                    <div class="chart-container">
                        <canvas id="heartRateChart"></canvas>
                    </div>
                </div>

                <div class="chart-section">
                    <h3>血压趋势</h3>
                    <div class="chart-container">
                        <canvas id="bloodPressureChart"></canvas>
                    </div>
                </div>

                <div class="chart-section">
                    <h3>体温趋势</h3>
                    <div class="chart-container">
                        <canvas id="temperatureChart"></canvas>
                    </div>
                </div>

                <!-- 详细数据表格 -->
                <div class="data-table-section table-section">
                    <h2>详细数据记录</h2>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>测量时间</th>
                                <th>心率 (bpm)</th>
                                <th>收缩压 (mmHg)</th>
                                <th>舒张压 (mmHg)</th>
                                <th>体温 (°C)</th>
                                <th>血糖 (mmol/L)</th>
                                <th>步数</th>
                                <th>睡眠时长 (分钟)</th>
                            </tr>
                        </thead>
                        <tbody id="healthDataTableBody">
                            <tr>
                                <td colspan="8" class="loading">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <nav class="bottom-nav" aria-label="移动端主导航">
            <a href="family-dashboard.html" class="bottom-nav-item active" data-family-nav="dashboard">
                <span class="icon">📊</span>
                <span>总览</span>
            </a>
            <a href="family-chat.html" class="bottom-nav-item" data-family-nav="chat">
                <span class="icon">💬</span>
                <span>沟通</span>
            </a>
            <a href="family-location.html" class="bottom-nav-item" data-family-nav="location">
                <span class="icon">📍</span>
                <span>定位</span>
            </a>
            <a href="family-services.html" class="bottom-nav-item" data-family-nav="services">
                <span class="icon">🏥</span>
                <span>服务</span>
            </a>
            <a href="family-me.html" class="bottom-nav-item" data-family-nav="me">
                <span class="icon">👤</span>
                <span>我</span>
            </a>
        </nav>
    </div>

    <script src="js/common.js"></script>
    <script src="js/family-mobile.js"></script>
    <script src="js/family-health.js"></script>
</body>
</html>
