<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老人档案 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="admin-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">医护人员</p>
            </div>
            <nav class="nav-menu">
                <a href="medical-dashboard.html" class="nav-item">
                    <span class="icon">🩺</span>
                    <span>医护工作台</span>
                </a>
                <a href="medical-patients.html" class="nav-item active">
                    <span class="icon">👴</span>
                    <span>老人档案</span>
                </a>
                <a href="medical-schedule.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>我的排班</span>
                </a>
                <a href="medical-rounds.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>巡诊记录</span>
                </a>
                <a href="medical-alerts.html" class="nav-item">
                    <span class="icon">⚠️</span>
                    <span>告警中心</span>
                </a>
                <a href="medical-chat.html" class="nav-item">
                    <span class="icon">💬</span>
                    <span>医护-子女聊天</span>
                </a>
                <a href="medical-leave.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>请假申请</span>
                </a>
                <a href="medical-services.html" class="nav-item">
                    <span class="icon">💳</span>
                    <span>生活服务录入</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <h1>老人档案</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎，医护人员！</span>
                </div>
            </header>

            <!-- 操作栏 -->
            <section class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索姓名...">
                    <button onclick="searchPatients()">搜索</button>
                </div>
            </section>

            <!-- 老人列表 -->
            <section class="table-section">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>编号</th>
                            <th>姓名</th>
                            <th>年龄</th>
                            <th>性别</th>
                            <th>房间号</th>
                            <th>紧急联系人</th>
                            <th>紧急电话</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="patientsTableBody">
                        <tr>
                            <td colspan="8" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>

                <!-- 分页 -->
                <div class="pagination">
                    <button id="prevBtn" onclick="prevPage()">上一页</button>
                    <span id="pageInfo">第 1 页</span>
                    <button id="nextBtn" onclick="nextPage()">下一页</button>
                </div>
            </section>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/medical-patients.js"></script>
</body>

</html>
