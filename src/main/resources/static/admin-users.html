<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">管理员</p>
            </div>
            <nav class="nav-menu">
                <a href="admin-dashboard.html" class="nav-item">
                    <span class="icon">📊</span>
                    <span>数据仪表盘</span>
                </a>
                <a href="admin-users.html" class="nav-item active">
                    <span class="icon">👥</span>
                    <span>用户管理</span>
                </a>
                <a href="admin-elderly.html" class="nav-item">
                    <span class="icon">👴</span>
                    <span>老人信息管理</span>
                </a>
                <a href="admin-schedule.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>医护排班</span>
                </a>
                <a href="admin-leave.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>请假审批</span>
                </a>
                <a href="admin-devices.html" class="nav-item">
                    <span class="icon">📱</span>
                    <span>设备管理</span>
                </a>
                <a href="admin-alerts.html" class="nav-item">
                    <span class="icon">⚠️</span>
                    <span>预警管理</span>
                </a>
                <a href="admin-settings.html" class="nav-item">
                    <span class="icon">⚙️</span>
                    <span>系统设置</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <h1>用户管理</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎，管理员！</span>
                </div>
            </header>

            <!-- 操作栏 -->
            <section class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索用户名、姓名或手机号">
                    <button onclick="searchUsers()">搜索</button>
                </div>
                <div class="filter-box">
                    <select id="roleFilter" onchange="loadUsers()">
                        <option value="">全部角色</option>
                        <option value="ADMIN">管理员</option>
                        <option value="FAMILY">子女</option>
                        <option value="MEDICAL">医护人员</option>
                        <option value="ELDERLY">老人</option>
                    </select>
                    <select id="statusFilter" onchange="loadUsers()">
                        <option value="">全部状态</option>
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="showCreateUserModal()">➕ 新增用户</button>
            </section>

            <!-- 用户列表 -->
            <section class="table-section">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>真实姓名</th>
                            <th>手机号</th>
                            <th>邮箱</th>
                            <th>角色</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="8" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>

                <!-- 分页 -->
                <div class="pagination">
                    <button id="prevBtn" onclick="prevPage()">上一页</button>
                    <span id="pageInfo">第 1 页</span>
                    <button id="nextBtn" onclick="nextPage()">下一页</button>
                </div>
            </section>
        </main>
    </div>

    <!-- 新增/编辑用户模态框 -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">新增用户</h2>
                <span class="close" onclick="closeUserModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <input type="hidden" id="userId">
                    <div class="form-group">
                        <label>用户名 *</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group" id="passwordGroup">
                        <label>密码 *</label>
                        <input type="password" id="password" required>
                    </div>
                    <div class="form-group">
                        <label>真实姓名 *</label>
                        <input type="text" id="realName" required>
                    </div>
                    <div class="form-group">
                        <label>手机号 *</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="email">
                    </div>
                    <div class="form-group">
                        <label>角色 *</label>
                        <select id="role" required>
                            <option value="">请选择角色</option>
                            <option value="ADMIN">管理员</option>
                            <option value="FAMILY">子女</option>
                            <option value="MEDICAL">医护人员</option>
                            <option value="ELDERLY">老人</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select id="status">
                            <option value="1">启用</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeUserModal()">取消</button>
                <button class="btn-primary" onclick="saveUser()">保存</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/admin-users.js"></script>
</body>
</html>
