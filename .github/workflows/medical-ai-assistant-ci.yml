name: Medical AI Assistant CI

on:
  push:
    branches:
      - feat/medical-ai-assistant
    paths:
      - 'src/main/java/org/example/persion/**/MedicalAi*'
      - 'src/main/java/org/example/persion/service/impl/MedicalAiAssistantServiceImpl.java'
      - 'src/main/resources/static/medical-ai-assistant.html'
      - 'src/main/resources/static/css/medical-ai-assistant.css'
      - 'src/main/resources/static/js/medical-ai-assistant.js'
      - 'src/test/java/org/example/persion/service/impl/MedicalAiAssistantServiceImplTest.java'
      - '.github/workflows/medical-ai-assistant-ci.yml'
  pull_request:
    paths:
      - 'src/main/java/org/example/persion/**/MedicalAi*'
      - 'src/main/java/org/example/persion/service/impl/MedicalAiAssistantServiceImpl.java'
      - 'src/main/resources/static/medical-ai-assistant.html'
      - 'src/main/resources/static/css/medical-ai-assistant.css'
      - 'src/main/resources/static/js/medical-ai-assistant.js'
      - 'src/test/java/org/example/persion/service/impl/MedicalAiAssistantServiceImplTest.java'
  workflow_dispatch:

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run focused Java tests
        run: |
          chmod +x mvnw
          ./mvnw -q -Dtest=MedicalAiAssistantServiceImplTest test
      - name: Check assistant JavaScript syntax
        run: node --check src/main/resources/static/js/medical-ai-assistant.js
