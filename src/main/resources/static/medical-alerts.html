<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警中心 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/medical-alerts.css">
</head>

<body>
    <div class="admin-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">医护人员</p>
            </div>
            <nav class="nav-menu">
                <a href="medical-dashboard.html" class="nav-item">
                    <span class="icon">🩺</span>
                    <span>医护工作台</span>
                </a>
                <a href="medical-patients.html" class="nav-item">
                    <span class="icon">👴</span>
                    <span>老人档案</span>
                </a>
                <a href="medical-schedule.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>我的排班</span>
                </a>
                <a href="medical-rounds.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>巡诊记录</span>
                </a>
                <a href="medical-alerts.html" class="nav-item active">
                    <span class="icon">⚠️</span>
                    <span>告警中心</span>
                </a>
                <a href="medical-chat.html" class="nav-item">
                    <span class="icon">💬</span>
                    <span>医护-子女聊天</span>
                </a>
                <a href="medical-leave.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>请假申请</span>
                </a>
                <a href="medical-services.html" class="nav-item">
                    <span class="icon">💳</span>
                    <span>生活服务录入</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <header class="top-bar">
                <h1>告警中心</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎，医护人员！</span>
                </div>
            </header>

            <section class="alert-summary">
                <div class="summary-card total">
                    <p>全部告警</p>
                    <h3 id="summaryTotal">0</h3>
                </div>
                <div class="summary-card pending">
                    <p>待处理</p>
                    <h3 id="summaryPending">0</h3>
                </div>
                <div class="summary-card processing">
                    <p>处理中</p>
                    <h3 id="summaryProcessing">0</h3>
                </div>
                <div class="summary-card handled">
                    <p>已处理/忽略</p>
                    <h3 id="summaryHandled">0</h3>
                </div>
            </section>

            <section class="alert-controls">
                <div class="status-tabs" id="statusTabs">
                    <button class="status-tab" data-status="">全部</button>
                    <button class="status-tab active" data-status="待处理">待处理</button>
                    <button class="status-tab" data-status="处理中">处理中</button>
                    <button class="status-tab" data-status="已处理">已处理</button>
                    <button class="status-tab" data-status="已忽略">已忽略</button>
                </div>
                <div class="filter-row">
                    <div class="filter-item">
                        <label for="filterKeyword">老人姓名</label>
                        <input type="text" id="filterKeyword" placeholder="输入姓名关键字">
                    </div>
                    <div class="filter-item">
                        <label for="filterType">告警类型</label>
                        <select id="filterType">
                            <option value="">全部类型</option>
                            <option value="心率异常">心率异常</option>
                            <option value="血压异常">血压异常</option>
                            <option value="血糖异常">血糖异常</option>
                            <option value="体温异常">体温异常</option>
                            <option value="跌倒">跌倒</option>
                            <option value="离家">离家</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label for="filterLevel">告警等级</label>
                        <select id="filterLevel">
                            <option value="">全部等级</option>
                            <option value="低">低</option>
                            <option value="中">中</option>
                            <option value="高">高</option>
                            <option value="紧急">紧急</option>
                        </select>
                    </div>
                    <div class="filter-actions">
                        <button class="btn-primary" id="filterApplyBtn">筛选</button>
                        <button class="btn-secondary" id="filterResetBtn">重置</button>
                        <button class="btn-outline" id="refreshBtn">刷新</button>
                    </div>
                </div>
            </section>

            <section class="table-section alert-table-section">
                <div class="table-scroll">
                    <table class="data-table alert-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>时间</th>
                                <th>老人</th>
                                <th>房间</th>
                                <th>类型</th>
                                <th>等级</th>
                                <th>内容</th>
                                <th>数值</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="alertTableBody">
                            <tr>
                                <td colspan="9" class="empty-tip">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="table-footer">
                    <div class="record-info">共 <span id="recordTotal">0</span> 条记录</div>
                    <div class="pagination">
                        <button id="prevPageBtn">上一页</button>
                        <span id="paginationInfo">第 1 / 1 页</span>
                        <button id="nextPageBtn">下一页</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sockjs.min.js"></script>
    <script src="js/stomp.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/medical-alerts.js"></script>
</body>

</html>
