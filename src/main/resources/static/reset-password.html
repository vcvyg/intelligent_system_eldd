<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧养老系统 - 重置密码</title>

    <!-- CSS变量系统 -->
    <link rel="stylesheet" href="css/pension-variables.css">

    <!-- 民宿基础组件 -->
    <link rel="stylesheet" href="css/penou-base.css">

    <!-- 重置密码页样式(复用注册页样式) -->
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- 左侧内容区 -->
        <div class="content-side">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="48" height="48" rx="12" fill="url(#gradient)"/>
                        <path d="M24 14C18.48 14 14 18.48 14 24C14 29.52 18.48 34 24 34C29.52 34 34 29.52 34 24C34 18.48 29.52 14 24 14ZM24 17C25.66 17 27 18.34 27 20C27 21.66 25.66 23 24 23C22.34 23 21 21.66 21 20C21 18.34 22.34 17 24 17ZM24 31.2C21.5 31.2 19.29 29.92 18 28C18.03 26 22 24.9 24 24.9C26 24.9 29.97 26 30 28C28.71 29.92 26.5 31.2 24 31.2Z" fill="white"/>
                        <defs>
                            <linearGradient id="gradient" x1="0" y1="0" x2="48" y2="48">
                                <stop offset="0%" stop-color="#FA5D29"/>
                                <stop offset="100%" stop-color="#502bd8"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="logo-text">智慧养老系统</h1>
                <p class="logo-subtitle">Intelligent Elderly Care System</p>
            </div>

            <!-- 提示信息卡片 -->
            <div class="swiper-container">
                <div class="feature-card">
                    <div class="card-icon">
                        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                            <circle cx="32" cy="32" r="32" fill="#AAEEC4" opacity="0.2"/>
                            <path d="M32 14C21.51 14 13 22.51 13 33C13 43.49 21.51 52 32 52C42.49 52 51 43.49 51 33C51 22.51 42.49 14 32 14ZM32 20C34.21 20 36 21.79 36 24C36 26.21 34.21 28 32 28C29.79 28 28 26.21 28 24C28 21.79 29.79 20 32 20ZM32 44C26.33 44 21.6 40.67 19 36C19.04 31.34 28.66 28.75 32 28.75C35.34 28.75 44.96 31.34 45 36C42.4 40.67 37.67 44 32 44Z" fill="#AAEEC4"/>
                        </svg>
                    </div>
                    <h3>安全重置密码</h3>
                    <p>通过您注册时绑定的邮箱接收验证码,即可安全地重置您的密码</p>
                    <div class="card-stats">
                        <div class="stat-item">
                            <span class="stat-number">100%</span>
                            <span class="stat-label">安全保障</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧表单区 -->
        <div class="form-side">
            <div class="form-container">
                <div class="form-header">
                    <h2>重置密码</h2>
                    <p>请输入您的邮箱以接收验证码</p>
                </div>

                <form id="resetForm" class="auth-form">
                    <div class="input-group">
                        <label for="email">邮箱 <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="email" id="email" name="email" placeholder="请输入注册时的邮箱" required>
                        </div>
                        <span class="validation-hint" id="emailHint"></span>
                    </div>

                    <div class="input-group">
                        <label for="code">验证码 <span class="required">*</span></label>
                        <div class="code-input-wrapper">
                            <input type="text" id="code" name="code" placeholder="请输入验证码" required maxlength="6">
                            <button type="button" id="sendCodeBtn" class="btn-code">获取验证码</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="newPassword">新密码 <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" id="newPassword" name="newPassword" placeholder="至少6位字符" required>
                        </div>
                        <div class="password-strength">
                            <div class="strength-bar">
                                <div class="strength-bar-fill"></div>
                            </div>
                            <span class="strength-text"></span>
                        </div>
                        <span class="validation-hint" id="newPasswordHint"></span>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">确认新密码 <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="再次输入新密码" required>
                        </div>
                        <span class="validation-hint" id="confirmPasswordHint"></span>
                    </div>

                    <button type="submit" class="btn-primary">
                        <span>重置密码</span>
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>

                    <div class="form-footer">
                        <span>想起密码了?</span>
                        <a href="login.html" class="link-primary">返回登录</a>
                    </div>
                </form>

                <div id="message" class="message-toast"></div>
            </div>
        </div>
    </div>

    <script src="js/reset-password.js"></script>
</body>
</html>
