<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老人健康档案详情 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
    <!-- ECharts图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .main-content {
            background: #f5f7fa;
        }

        .content-wrapper {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-card {
            background: white;
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.3s ease;
        }

        .section-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        /* 基本信息卡片 */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .profile-item {
            background: linear-gradient(135deg, #f6f8fb 0%, #ffffff 100%);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .profile-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .profile-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }

        .profile-item:hover::before {
            opacity: 1;
        }

        .profile-item h4 {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-item p {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            line-height: 1.4;
        }

        /* 图表容器 */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 24px;
        }

        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }

        .chart-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .chart-card h3 {
            font-size: 17px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-card h3::before {
            content: '📊';
            font-size: 20px;
        }

        .chart-placeholder {
            width: 100%;
            height: 320px;
        }

        /* 表格样式增强 */
        .table-section {
            background: white;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .data-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            font-size: 14px;
        }

        .data-table thead th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            padding: 14px 16px;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table thead th:first-child {
            border-top-left-radius: 8px;
        }

        .data-table thead th:last-child {
            border-top-right-radius: 8px;
        }

        .data-table tbody tr {
            transition: all 0.2s ease;
        }

        .data-table tbody tr:hover {
            background: #f9fafb;
            transform: scale(1.01);
        }

        .data-table tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        .data-table tbody tr:nth-child(even) {
            background: #fafbfc;
        }

        /* 返回链接样式 */
        .back-link {
            color: #667eea;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
            font-size: 15px;
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 15px;
            }

            .section-card {
                padding: 20px;
            }

            .chart-placeholder {
                height: 280px;
            }
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">医护人员</p>
            </div>
            <nav class="nav-menu">
                <a href="medical-dashboard.html" class="nav-item">
                    <span class="icon">🩺</span>
                    <span>医护工作台</span>
                </a>
                <a href="medical-patients.html" class="nav-item active"> <!-- 保持在老人档案高亮 -->
                    <span class="icon">👴</span>
                    <span>老人档案</span>
                </a>
                <a href="medical-schedule.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>我的排班</span>
                </a>
                <a href="medical-rounds.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>巡诊记录</span>
                </a>
                <a href="medical-alerts.html" class="nav-item">
                    <span class="icon">⚠️</span>
                    <span>告警中心</span>
                </a>
                <a href="medical-leave.html" class="nav-item">
                    <span class="icon">📋</span>
                    <span>请假申请</span>
                </a>
                <a href="medical-chat.html" class="nav-item">
                    <span class="icon">💬</span>
                    <span>医护-子女聊天</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <header class="top-bar">
                <h1><a href="medical-patients.html" class="back-link">← 老人档案</a> / 健康详情</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎，医护人员！</span>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- 老人基本信息 -->
                <div class="section-card">
                    <h2 class="section-title">基本信息</h2>
                    <div id="profileGrid" class="profile-grid">
                        <!-- JS动态填充 -->
                        <div class="loading">加载中...</div>
                    </div>
                </div>

                <!-- 健康数据图表 -->
                <div class="section-card">
                    <h2 class="section-title">健康趋势分析</h2>
                    <div class="charts-container">
                        <div class="chart-card">
                            <h3>心率 & 血压</h3>
                            <div id="heartRateBloodPressureChart" class="chart-placeholder"></div>
                        </div>
                        <div class="chart-card">
                            <h3>体温 & 血糖</h3>
                            <div id="tempBloodSugarChart" class="chart-placeholder"></div>
                        </div>
                    </div>
                </div>

                <!-- 健康数据历史记录 -->
                <div class="table-section">
                    <h2 class="section-title">健康数据历史记录</h2>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>测量时间</th>
                                <th>心率</th>
                                <th>血压</th>
                                <th>体温</th>
                                <th>血糖</th>
                                <th>睡眠</th>
                                <th>步数</th>
                            </tr>
                        </thead>
                        <tbody id="healthRecordsTableBody">
                            <tr>
                                <td colspan="7" class="loading">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/medical-patient-detail.js"></script>
</body>

</html>
