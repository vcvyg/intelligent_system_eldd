spring.application.name=Persion
server.port=${SERVER_PORT:8080}

# SQL Server
# Required in real/local environments. Keep credentials outside Git.
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# MyBatis Plus
mybatis-plus.mapper-locations=classpath:mybatis/mapper/**/*.xml
mybatis-plus.type-aliases-package=org.example.persion.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.configuration.cache-enabled=true
mybatis-plus.configuration.lazy-loading-enabled=true
mybatis-plus.configuration.aggressive-lazy-loading=false

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=60000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-wait=-1
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# JWT (required)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# SMTP. Leave empty when mail features are not used.
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.example.persion=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# DevTools
spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED:false}

# Admin invitation code (required)
admin.invitation-code=${ADMIN_INVITATION_CODE}

# Uploads
file.upload.path=${FILE_UPLOAD_PATH:./uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# AMap. Location tasks are disabled by default, so this may remain empty locally.
amap.api.key=${AMAP_API_KEY:}
location.task.enabled=${LOCATION_TASK_ENABLED:false}
location.task.interval=${LOCATION_TASK_INTERVAL:120}
location.task.cron=${LOCATION_TASK_CRON:0 0 */2 * * ?}
location.task.initial.enabled=${LOCATION_TASK_INITIAL_ENABLED:false}
location.api.cache.minutes=${LOCATION_CACHE_MINUTES:120}
amap.api.daily.limit=${AMAP_DAILY_LIMIT:100}
amap.api.hourly.limit=${AMAP_HOURLY_LIMIT:20}

# Optional OpenAI-compatible model. Disabled by default.
# Fact rewriting and semantic planning are separate switches; use an approved/internal endpoint for medical workloads.
medical.ai.enabled=${MEDICAL_AI_ENABLED:false}
medical.ai.planner-enabled=${MEDICAL_AI_PLANNER_ENABLED:false}
medical.ai.base-url=${MEDICAL_AI_BASE_URL:}
medical.ai.api-key=${MEDICAL_AI_API_KEY:}
medical.ai.model=${MEDICAL_AI_MODEL:}
medical.ai.timeout-ms=${MEDICAL_AI_TIMEOUT_MS:5000}
