<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警中心 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/medical-alerts.css">
</head>

<body>
    <div class="admin-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">医护人员</p>
            </div>
            <nav class="nav-menu">
                <a href="medical-dashboard.html" class="nav-item">
                    <span class="icon">🩺</span>
                    <span>医护工作台</span>
                </a>
                <a href="medical-patients.html" class="nav-item">
                    <span class="icon">👴</span>
                    <span>老人档案</span>
                </a>
                <a href="medical-schedule.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>我的排班</span>
                </a>
                <a href="medical-rounds.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>巡诊记录</span>
                </a>
                <a href="medical-alerts.html" class="nav-item active">
                    <span class="icon">⚠️</span>
                    <span>告警中心</span>
                </a>
                <a href="medical-chat.html" class="nav-item">
                    <span class="icon">💬</span>
                    <span>医护-子女聊天</span>
                </a>
                <a href="medical-leave.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>请假申请</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <header class="top-bar">
                <h1>告警中心</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎，医护人员！</span>
                </div>
            </header>

            <!-- 内容区域 -->
            <section>
                <h2>告警列表</h2>
                <div class="filter-bar">
                    <!-- 筛选功能未来可添加 -->
                </div>
                <div id="alert-list-container" class="alert-list">
                    <!-- 告警卡片将通过JS动态插入这里 -->
                </div>
            </section>

        </main>
    </div>

    <script src="js/sockjs.min.js"></script>
    <script src="js/stomp.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/medical-alerts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 初始化DOM缓存
            domCache.init();
            
            const userInfo = checkLogin();
            if (!userInfo || userInfo.role !== 'MEDICAL') {
                alert('权限不足');
                logout();
                return;
            }
            
            if (domCache.welcomeText) {
                domCache.welcomeText.textContent = `欢迎, ${userInfo.username}!`;
            }

            // 异步初始化告警页面，避免阻塞渲染
            Promise.all([
                loadAlerts(),
                connectWebSocket(userInfo.userId)
            ]).catch(error => {
                console.error('初始化失败:', error);
            });
        });
    </script>
</body>

</html>
