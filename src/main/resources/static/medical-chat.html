<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>医护-子女聊天 - 智慧养老系统</title>
  <link rel="stylesheet" href="css/pension-variables.css">
  <link rel="stylesheet" href="css/penou-base.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/medical-chat.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body>
  <div class="admin-container">
    <!-- 侧边栏导航（与其他页面一致） -->
    <aside class="sidebar">
      <div class="logo">
        <h2>智慧养老系统</h2>
        <p class="role-badge">医护人员</p>
      </div>
      <nav class="nav-menu">
        <a href="medical-dashboard.html" class="nav-item">
          <span class="icon">🩺</span>
          <span>医护工作台</span>
        </a>
        <a href="medical-patients.html" class="nav-item">
          <span class="icon">👴</span>
          <span>老人档案</span>
        </a>
        <a href="medical-schedule.html" class="nav-item">
          <span class="icon">📅</span>
          <span>我的排班</span>
        </a>
        <a href="medical-rounds.html" class="nav-item">
          <span class="icon">📝</span>
          <span>巡诊记录</span>
        </a>
        <a href="medical-alerts.html" class="nav-item">
          <span class="icon">⚠️</span>
          <span>告警中心</span>
        </a>
        <a href="medical-chat.html" class="nav-item active">
          <span class="icon">💬</span>
          <span>医护-子女聊天</span>
        </a>
          <a href="medical-leave.html" class="nav-item">
          <span class="icon">📝</span>
            <span>请假申请</span>
          </a>
        <a href="medical-services.html" class="nav-item">
          <span class="icon">💳</span>
          <span>生活服务录入</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">退出登录</button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <header class="top-bar">
        <h1>医护-子女聊天</h1>
        <div class="user-info">
          <span id="welcomeText">欢迎，医护人员！</span>
        </div>
      </header>
      <div class="content-wrapper">
        <div class="chat-container">
          <div class="chat-users">
            <h3>老人群组</h3>
            <div class="user-list" id="userList">
              <!-- 动态加载群组列表 -->
            </div>
          </div>
          <div class="chat-main">
            <div class="chat-header" id="chatHeader">请选择一个群组开始聊天</div>
            <div class="chat-messages" id="chatMessages">
              <!-- 聊天消息 -->
            </div>
            <div class="chat-input">
              <button type="button" class="icon-btn" onclick="startRecordAudio()" id="recordBtn" title="录制语音" disabled>
                <svg class="icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
                  focusable="false">
                  <path
                    d="M512 704c70.7 0 128-57.3 128-128V320c0-70.7-57.3-128-128-128s-128 57.3-128 128v256c0 70.7 57.3 128 128 128z m256-128c0 141.4-114.6 256-256 256s-256-114.6-256-256h64c0 105.9 86.1 192 192 192s192-86.1 192-192h64z" />
                </svg>
              </button>
              <div class="input-box">
                <textarea id="chatInput" placeholder="输入消息..." disabled></textarea>
              </div>
              <button type="button" class="icon-btn toggle-extra-btn" id="toggleExtrasBtn" disabled title="更多功能" aria-expanded="false">
                <i class="fas fa-plus"></i>
              </button>
              <button onclick="sendMessage()" disabled id="sendBtn" title="发送" class="send-btn">
                <svg t="1710830000002" class="icon" viewBox="0 0 1024 1024" width="20" height="20"
                  style="vertical-align:middle;margin-right:4px;">
                  <path
                    d="M928 112L96 464c-17.6 7.2-17.6 32 0 39.2l176.8 72.8 72.8 176.8c7.2 17.6 32 17.6 39.2 0l352-832c7.2-17.6-10.4-35.2-28-28zM416 832l-64-160-160-64 704-288-288 704z"
                    fill="#fff" />
                </svg>
                <span style="font-size:15px;">发送</span>
              </button>
              <div class="chat-extra-panel" id="chatExtraPanel">
                <div class="chat-extra-grid">
                  <button type="button" class="extra-item" id="image-btn" disabled title="发送图片">
                    <i class="fas fa-image"></i>
                    <span>照片</span>
                  </button>
                  <button type="button" class="extra-item" id="file-btn" disabled title="发送文件">
                    <i class="fas fa-file-alt"></i>
                    <span>文件</span>
                  </button>
                </div>
              </div>
              <input type="file" id="imageInput" accept="image/*" style="display:none"
                onchange="onImageSelected(event)">
              <input type="file" id="fileInput" style="display:none"
                onchange="onFileSelected(event)">
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/medical-chat-fixed.js"></script>
  <!-- 使用本地WebSocket库以提高加载速度 -->
  <script src="js/sockjs.min.js"></script>
  <script src="js/stomp.umd.min.js"></script>
</body>

</html>
