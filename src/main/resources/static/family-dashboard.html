<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家人数据仪表盘 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/family-mobile.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .mobile-elderly-scroll {
            overflow-y: auto;
            padding: 0 12px 90px;
        }

        .mobile-elderly-list {
            display: flex;
            flex-direction: column;
            margin: 10px 20px 20px;
            gap: 12px;
        }

        .mobile-elderly-card {
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 16px;
            background: #fff;
            box-shadow: 0 2px 6px rgba(15,23,42,0.05);
        }

        .mobile-elderly-card h3 {
            margin: 0 0 6px;
            font-size: 16px;
        }

        .mobile-elderly-card .meta {
            font-size: 13px;
            color: var(--color-text-gray);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }

        .mobile-elderly-card .metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .mobile-elderly-card .metrics span {
            color: var(--color-text);
        }

        .mobile-elderly-card .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 768px) {
            body, html {
                overflow-x: hidden;
                background: var(--color-bg, #f5f7fb);
            }
            .stats-section {
                padding-bottom: 10px;
            }
            .table-responsive {
                margin-bottom: 12px;
            }
            .mobile-elderly-list {
                margin: 10px 8px 20px;
            }
        }

        @media (min-width: 769px) {
            .mobile-elderly-scroll {
                display: none;
            }
        }
    </style>
</head>
<body data-family-nav="dashboard">
    <div class="admin-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">子女端</p>
            </div>
            <nav class="nav-menu">
                <a href="family-dashboard.html" class="nav-item active">
                    <span class="icon">📊</span>
                    <span>家人数据总览</span>
                </a>
                <a href="family-chat.html" class="nav-item">
                    <span class="icon">💬</span>
                    <span>沟通通道</span>
                </a>
                <a href="family-location.html" class="nav-item">
                    <span class="icon">📍</span>
                    <span>GPS定位</span>
                </a>
                <a href="family-services.html" class="nav-item">
                    <span class="icon">🏥</span>
                    <span>医护服务</span>
                </a>
                <a href="family-me.html" class="nav-item">
                    <span class="icon">👤</span>
                    <span>账号中心</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <h1>家人数据总览</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎！</span>
                </div>
            </header>

            <!-- 统计卡片 -->
            <section class="stats-section">
                <div style="display:flex;flex-direction:column;gap:12px;margin:0 30px 20px 30px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                        <div style="font-weight:600;color:var(--color-text-gray);">
                            当前展示：<span id="currentRangeLabel" style="color:var(--color-text);">今日数据</span>
                        </div>
                        <div style="display:flex;gap:10px;flex-wrap:wrap;">
                            <button class="btn-secondary" onclick="setTimeRange('today')" id="todayRangeBtn">仅看今日</button>
                            <button class="btn-link" style="color:var(--color-primary);" onclick="toggleFullRangeFilters()" id="viewFullRangeBtn">查看完整数据</button>
                        </div>
                    </div>
                    <div id="fullRangeFilters" style="display:none;gap:8px;flex-wrap:wrap;">
                        <button class="btn-chip" data-range="7d" onclick="setTimeRange('7d')">近一周</button>
                        <button class="btn-chip" data-range="14d" onclick="setTimeRange('14d')">近两周</button>
                        <button class="btn-chip" data-range="30d" onclick="setTimeRange('30d')">近一月</button>
                    </div>
                </div>
                <div class="stats-grid" id="statsGrid">
                    <!-- 动态加载 -->
                </div>
                <div class="mobile-elderly-scroll" id="mobileElderlyWrapper">
                    <h3 style="margin:18px 12px 6px;font-size:16px;color:var(--color-text-dark);">绑定老人详情</h3>
                    <div class="mobile-elderly-list" id="mobileElderlyList">
                        <!-- 移动端卡片列表 -->
                    </div>
                </div>
                <div class="range-data-section" id="rangeDataSection" style="display:none;margin-top:12px;">
                    <h3 style="margin:18px 12px 10px;font-size:16px;color:var(--color-text-dark);">时间区间内的测量记录</h3>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>测量时间</th>
                                    <th>老人</th>
                                    <th>心率 (bpm)</th>
                                    <th>收缩压 (mmHg)</th>
                                    <th>舒张压 (mmHg)</th>
                                    <th>体温 (°C)</th>
                                    <th>血糖 (mmol/L)</th>
                                </tr>
                            </thead>
                            <tbody id="rangeDataBody">
                                <tr>
                                    <td colspan="7" style="text-align:center;color:var(--color-text-gray);padding:30px;">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 老人列表 -->
            <section class="table-section" style="margin: 0 30px 30px;">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 0;">
                    <h2 style="margin: 0;">关联老人列表</h2>
                    <button class="btn-primary" onclick="showBindElderlyModal()">
                        <span style="margin-right: 5px;">➕</span>绑定老人
                    </button>
                </div>
                <div class="desktop-elderly-table">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>姓名</th>
                                    <th>年龄</th>
                                    <th>关系</th>
                                    <th>最新心率</th>
                                    <th>最新血压</th>
                                    <th>最新体温</th>
                                    <th>健康状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="elderlyListBody">
                                <tr>
                                    <td colspan="8" class="loading">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
        <nav class="bottom-nav" aria-label="移动端主导航">
            <a href="family-dashboard.html" class="bottom-nav-item active" data-family-nav="dashboard">
                <span class="icon">📊</span>
                <span>总览</span>
            </a>
            <a href="family-chat.html" class="bottom-nav-item" data-family-nav="chat">
                <span class="icon">💬</span>
                <span>沟通</span>
            </a>
            <a href="family-location.html" class="bottom-nav-item" data-family-nav="location">
                <span class="icon">📍</span>
                <span>定位</span>
            </a>
            <a href="family-services.html" class="bottom-nav-item" data-family-nav="services">
                <span class="icon">🏥</span>
                <span>服务</span>
            </a>
            <a href="family-me.html" class="bottom-nav-item" data-family-nav="me">
                <span class="icon">👤</span>
                <span>我</span>
            </a>
        </nav>
    </div>

    <!-- 绑定老人模态框 -->
    <div id="bindElderlyModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2>绑定老人</h2>
                <span class="modal-close" onclick="closeBindElderlyModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">搜索老人（姓名或身份证号）</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="searchElderlyInput" class="form-input" 
                               placeholder="请输入老人姓名或身份证号" 
                               style="flex: 1;"
                               onkeypress="if(event.key === 'Enter') searchElderly()">
                        <button class="btn-primary" onclick="searchElderly()">搜索</button>
                    </div>
                </div>
                <div id="searchResults" style="margin-top: 20px;">
                    <p style="text-align: center; color: var(--color-text-gray); padding: 20px;">
                        请输入搜索关键词查找老人
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/family-mobile.js"></script>
    <script src="js/family-dashboard.js"></script>
</body>
</html>
