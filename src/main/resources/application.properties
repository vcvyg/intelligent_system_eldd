# 高德地图API配置
# 请到 https://console.amap.com/dev/key/app 申请您的API Key
amap.api.key=b3dcf158ba90489993d21415d6b313a0

# 定位服务配置
# 是否启用定时定位更新任务（true=启用，false=禁用）
# 建议：如果API调用次数有限，设置为false禁用定时任务，改为手动触发更新
location.task.enabled=false
# 定位更新间隔（分钟），以避免API超限
location.task.interval=120
# 定时任务cron表达式（每2小时执行一次，避免API超限）
# 格式：秒 分 时 日 月 周
# 示例：每30分钟 = "0 */30 * * * ?"
#       每1小时 = "0 0 * * * ?"
#       每2小时 = "0 0 */2 * * ?"
#       每天凌晨2点 = "0 0 2 * * ?"
location.task.cron=0 0 */2 * * ?
# 是否启用系统启动后的首次更新（true=启用，false=禁用）
location.task.initial.enabled=false
# API调用缓存时间（分钟），相同IP在缓存时间内不会重复调用API
# 建议设置为120分钟或更长，避免频繁调用导致超限
location.api.cache.minutes=120

# 高德地图API调用限制配置
# 每日最大调用次数（根据你的API套餐设置）
# 个人开发者通常为5000次/天，企业开发者为30000次/天
amap.api.daily.limit=100
# 每小时最大调用次数（避免短时间内大量调用）
amap.api.hourly.limit=20