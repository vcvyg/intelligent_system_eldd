<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医护工作台 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="admin-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">医护人员</p>
            </div>
            <nav class="nav-menu">
                <a href="medical-dashboard.html" class="nav-item active">
                    <span class="icon">🩺</span>
                    <span>医护工作台</span>
                </a>
                <a href="medical-patients.html" class="nav-item">
                    <span class="icon">👴</span>
                    <span>老人档案</span>
                </a>
                <a href="medical-schedule.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>我的排班</span>
                </a>
                <a href="medical-rounds.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>巡诊记录</span>
                </a>
                <a href="medical-alerts.html" class="nav-item">
                    <span class="icon">⚠️</span>
                    <span>告警中心</span>
                </a>
                <a href="medical-chat.html" class="nav-item">
                    <span class="icon">💬</span>
                    <span>医护-子女聊天</span>
                </a>
                <a href="medical-leave.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>请假申请</span>
                </a>
                <a href="medical-services.html" class="nav-item">
                    <span class="icon">💳</span>
                    <span>生活服务录入</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <h1>医护工作台</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎，医护人员！</span>
                </div>
            </header>

            <!-- 主内容将在这里动态加载 -->
            <section class="stats-section">
                <div class="stats-grid" id="statsGrid">
                    <!-- 动态加载 -->
                    <div class="stat-card">
                        <div class="stat-info">
                            <h3>加载中...</h3>
                            <p class="stat-value">-</p>
                        </div>
                    </div>
                </div>
            </section>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 30px 30px;">
                <section class="table-section">
                    <h2>今日排班</h2>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>班次</th>
                                <th>状态</th>
                                <th>房间</th>
                            </tr>
                        </thead>
                        <tbody id="todaySchedulesBody">
                            <!-- JS动态填充 -->
                        </tbody>
                    </table>
                </section>

                <section class="table-section">
                    <h2>待处理告警</h2>
                    <div class="table-scroll">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>时间</th>
                                    <th>老人</th>
                                    <th>告警内容</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="pendingAlertsBody">
                                <!-- JS动态填充 -->
                            </tbody>
                        </table>
                    </div>
                    <div class="table-footer">
                        <p id="pendingAlertsTip" class="table-tip">共 <span id="pendingAlertsTotal">0</span> 条待处理告警</p>
                        <div class="pagination" id="pendingAlertsPagination" style="display:none;">
                            <button id="pendingPrevBtn">上一页</button>
                            <span id="pendingPageInfo">第 1 / 1 页</span>
                            <button id="pendingNextBtn">下一页</button>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/medical-dashboard.js"></script>
</body>

</html>
