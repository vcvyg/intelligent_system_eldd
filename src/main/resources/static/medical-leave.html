<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请假申请 - 智慧养老系统</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">医护端</p>
            </div>
            <nav class="nav-menu">
                <a href="medical-dashboard.html" class="nav-item">
                    <span class="icon">🩺</span>
                    <span>医护工作台</span>
                </a>
                <a href="medical-patients.html" class="nav-item">
                    <span class="icon">👴</span>
                    <span>老人档案</span>
                </a>
                <a href="medical-schedule.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>我的排班</span>
                </a>
                <a href="medical-rounds.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>巡诊记录</span>
                </a>
                <a href="medical-alerts.html" class="nav-item">
                    <span class="icon">⚠️</span>
                    <span>告警中心</span>
                </a>
                <a href="medical-leave.html" class="nav-item active">
                    <span class="icon">📝</span>
                    <span>请假申请</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <header class="top-bar">
                <h1>请假申请</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎!</span>
                </div>
            </header>

            <div class="content-wrapper" style="padding: 24px;">
                <!-- 新增申请按钮 -->
                <div style="margin-bottom: 20px;">
                    <button class="w-button" onclick="showAddModal()">➕ 新增请假申请</button>
                </div>

                <!-- 申请列表 -->
                <div class="card">
                    <h3 style="margin-bottom: 16px;">我的申请记录</h3>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>申请类型</th>
                                <th>开始日期</th>
                                <th>结束日期</th>
                                <th>天数</th>
                                <th>申请原因</th>
                                <th>状态</th>
                                <th>审批备注</th>
                                <th>申请时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="leaveTableBody">
                            <tr><td colspan="9" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增申请模态框 -->
    <div id="addLeaveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>新增请假申请</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="leaveForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>请假类型 *</label>
                            <select id="leaveType" required>
                                <option value="事假">事假</option>
                                <option value="病假">病假</option>
                                <option value="年假">年假</option>
                                <option value="调休">调休</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>开始日期 *</label>
                            <input type="date" id="startDate" required onchange="calculateDays()">
                        </div>
                        <div class="form-group">
                            <label>结束日期 *</label>
                            <input type="date" id="endDate" required onchange="calculateDays()">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>申请天数</label>
                        <p><span id="daysCount">0</span> 天</p>
                    </div>
                    <div class="form-group">
                        <label>请假事由 *</label>
                        <textarea id="reason" rows="4" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="submitLeaveRequest()">提交申请</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/medical-leave.js"></script>
</body>
</html>
