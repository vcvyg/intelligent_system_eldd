<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请假申请 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/medical.css">
</head>
<body>
    <div class="medical-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">医护端</p>
            </div>
            <nav class="nav-menu">
                <a href="medical-dashboard.html" class="nav-item">
                    <span class="icon">📊</span><span>工作台</span>
                </a>
                <a href="medical-schedule.html" class="nav-item">
                    <span class="icon">📅</span><span>我的排班</span>
                </a>
                <a href="medical-leave.html" class="nav-item active">
                    <span class="icon">📝</span><span>请假申请</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <header class="top-bar">
                <h1>请假申请</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎!</span>
                </div>
            </header>

            <div class="content-wrapper" style="padding: 24px;">
                <!-- 新增申请按钮 -->
                <div style="margin-bottom: 20px;">
                    <button class="btn-primary" onclick="showAddModal()">➕ 新增请假申请</button>
                </div>

                <!-- 申请列表 -->
                <div class="card">
                    <h3 style="margin-bottom: 16px;">我的申请记录</h3>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>申请类型</th>
                                <th>开始日期</th>
                                <th>结束日期</th>
                                <th>天数</th>
                                <th>申请原因</th>
                                <th>状态</th>
                                <th>审批备注</th>
                                <th>申请时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="leaveTableBody">
                            <tr><td colspan="9" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增申请模态框 -->
    <div id="leaveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>新增请假申请</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="leaveForm">
                    <div class="form-group">
                        <label>请假类型 *</label>
                        <select id="leaveType" required>
                            <option value="事假">事假</option>
                            <option value="病假">病假</option>
                            <option value="年假">年假</option>
                            <option value="调休">调休</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>开始日期 *</label>
                            <input type="date" id="startDate" required onchange="calculateDays()">
                        </div>
                        <div class="form-group">
                            <label>结束日期 *</label>
                            <input type="date" id="endDate" required onchange="calculateDays()">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>请假天数</label>
                        <input type="number" id="days" step="0.5" readonly style="background: #f3f4f6;">
                    </div>
                    <div class="form-group">
                        <label>请假原因 *</label>
                        <textarea id="reason" rows="4" required placeholder="请填写请假原因..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="submitLeave()">提交申请</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            const userInfo = checkLogin();
            if (!userInfo || userInfo.role !== 'MEDICAL') {
                alert('权限不足');
                logout();
                return;
            }
            document.getElementById('welcomeText').textContent = `欢迎,${userInfo.username}!`;
            loadLeaveRequests();
        });

        // 加载请假列表
        async function loadLeaveRequests() {
            const tbody = document.getElementById('leaveTableBody');
            tbody.innerHTML = '<tr><td colspan="9" class="loading">加载中...</td></tr>';

            try {
                const result = await get('/medical/leave/my');
                if (result.code === 200 && result.data) {
                    if (result.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999;">暂无申请记录</td></tr>';
                    } else {
                        tbody.innerHTML = result.data.map(item => `
                            <tr>
                                <td>${item.leave_type}</td>
                                <td>${item.start_date}</td>
                                <td>${item.end_date}</td>
                                <td>${item.days}天</td>
                                <td>${item.reason}</td>
                                <td><span class="badge ${getBadgeClass(item.status)}">${item.status}</span></td>
                                <td>${item.review_remark || '-'}</td>
                                <td>${formatDateTime(item.create_time)}</td>
                                <td>
                                    ${item.status === '待审批' ?
                                        `<button class="btn-danger" onclick="cancelLeave(${item.id})">撤销</button>` :
                                        '-'}
                                </td>
                            </tr>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error('加载失败:', error);
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:red;">加载失败</td></tr>';
            }
        }

        // 显示新增模态框
        function showAddModal() {
            document.getElementById('leaveForm').reset();
            document.getElementById('leaveModal').style.display = 'flex';
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('leaveModal').style.display = 'none';
        }

        // 计算天数
        function calculateDays() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            if (start && end) {
                const startDate = new Date(start);
                const endDate = new Date(end);
                const days = (endDate - startDate) / (1000 * 60 * 60 * 24) + 1;
                document.getElementById('days').value = days > 0 ? days : 0;
            }
        }

        // 提交申请
        async function submitLeave() {
            const leaveType = document.getElementById('leaveType').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const days = document.getElementById('days').value;
            const reason = document.getElementById('reason').value;

            if (!leaveType || !startDate || !endDate || !reason) {
                alert('请填写完整信息');
                return;
            }

            try {
                const result = await post('/medical/leave/submit', {
                    leaveType, startDate, endDate, days: parseFloat(days), reason
                });

                if (result.code === 200) {
                    alert('提交成功');
                    closeModal();
                    loadLeaveRequests();
                } else {
                    alert(result.message || '提交失败');
                }
            } catch (error) {
                console.error('提交失败:', error);
                alert('提交失败');
            }
        }

        // 撤销申请
        async function cancelLeave(id) {
            if (!confirm('确定要撤销这个申请吗?')) return;

            try {
                const result = await del(`/medical/leave/${id}`);
                if (result.code === 200) {
                    alert('撤销成功');
                    loadLeaveRequests();
                } else {
                    alert(result.message || '撤销失败');
                }
            } catch (error) {
                console.error('撤销失败:', error);
                alert('撤销失败');
            }
        }

        // 获取徽章样式
        function getBadgeClass(status) {
            if (status === '已同意') return 'badge-green';
            if (status === '已拒绝') return 'badge-red';
            return 'badge-yellow';
        }

        // 格式化日期时间
        function formatDateTime(dateTime) {
            if (!dateTime) return '-';
            return dateTime.substring(0, 16).replace('T', ' ');
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('leaveModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
