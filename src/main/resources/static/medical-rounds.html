<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巡诊记录 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/medical-rounds.css">
</head>

<body>
    <div class="admin-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">医护人员</p>
            </div>
            <nav class="nav-menu">
                <a href="medical-dashboard.html" class="nav-item">
                    <span class="icon">🩺</span>
                    <span>医护工作台</span>
                </a>
                <a href="medical-patients.html" class="nav-item">
                    <span class="icon">👴</span>
                    <span>老人档案</span>
                </a>
                <a href="medical-schedule.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>我的排班</span>
                </a>
                <a href="medical-rounds.html" class="nav-item active">
                    <span class="icon">📝</span>
                    <span>巡诊记录</span>
                </a>
                <a href="medical-alerts.html" class="nav-item">
                    <span class="icon">⚠️</span>
                    <span>告警中心</span>
                </a>
                <a href="medical-chat.html" class="nav-item">
                    <span class="icon">💬</span>
                    <span>医护-子女聊天</span>
                </a>
                <a href="medical-leave.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>请假申请</span>
                </a>
                <a href="medical-services.html" class="nav-item">
                    <span class="icon">💳</span>
                    <span>生活服务录入</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <header class="top-bar">
                <h1>巡诊记录</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎，医护人员！</span>
                </div>
            </header>

            <!-- 内容区域 -->
            <section class="content-wrapper" style="padding: 24px;">
                <div class="toolbar" style="margin: 0 0 20px 0; padding: 15px 20px; flex-wrap: wrap;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="recordDate" style="margin-right: 10px;">选择日期:</label>
                        <input type="date" id="recordDate" style="padding: 8px;">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="elderlySelect" style="margin-right: 10px;">选择老人:</label>
                        <select id="elderlySelect" style="padding: 8px; min-width: 150px;"></select>
                    </div>
                    <div class="search-box" style="flex-grow: 1; min-width: 200px;">
                        <input type="text" id="keywordSearch" placeholder="或按姓名搜索...">
                        <button class="btn-primary" id="searchBtn">搜索</button>
                    </div>
                </div>

                <div id="recordsContainer">
                    <!-- JS动态填充老人健康记录卡片 -->
                </div>
            </section>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/medical-rounds.js"></script>
</body>

</html>
