<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的排班 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/medical-schedule.css">
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">医护人员</p>
            </div>
            <nav class="nav-menu">
                <a href="medical-dashboard.html" class="nav-item">
                    <span class="icon">🩺</span>
                    <span>医护工作台</span>
                </a>
                <a href="medical-patients.html" class="nav-item">
                    <span class="icon">👴</span>
                    <span>老人档案</span>
                </a>
                <a href="medical-schedule.html" class="nav-item active">
                    <span class="icon">📅</span>
                    <span>我的排班</span>
                </a>
                <a href="medical-rounds.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>巡诊记录</span>
                </a>
                <a href="medical-alerts.html" class="nav-item">
                    <span class="icon">⚠️</span>
                    <span>告警中心</span>
                </a>
                <a href="medical-leave.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>请假申请</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <h1>我的排班</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎，医护人员！</span>
                </div>
            </header>

            <!-- 内容区域 -->
            <section class="schedule-main">
                <div class="schedule-toolbar">
                    <div class="toolbar-left">
                        <div class="week-navigator">
                            <button class="btn-secondary" onclick="previousWeek()">‹ 上一周</button>
                            <span id="weekInfo" class="week-info"></span>
                            <button class="btn-secondary" onclick="nextWeek()">下一周 ›</button>
                        </div>
                        <button class="btn-secondary" onclick="goToCurrentWeek()">回到本周</button>
                    </div>
                    <div class="toolbar-right">
                        <button class="btn-primary" onclick="printSchedule()">🖨️ 打印排班</button>
                    </div>
                </div>

                <div class="schedule-view">
                    <div class="week-view">
                        <div id="weekScheduleGrid" class="week-schedule-grid">
                            <!-- JS动态生成 -->
                        </div>
                    </div>
                </div>

                <div class="stats-bar">
                    <div class="stat-item">
                        <span class="label">本周排班总数:</span>
                        <span id="weekTotalSchedules" class="value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">本周总工时:</span>
                        <span id="weekTotalHours" class="value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">平均每日工时:</span>
                        <span id="weekAvgPerDay" class="value">0</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/medical-schedule.js"></script>
</body>
</html>
