<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据报告 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
    <!-- ECharts图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .report-container {
            padding: 30px;
        }
        .report-filters {
            background: var(--color-bg-lighter);
            padding: 25px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .report-display-area {
            background: var(--color-bg-lighter);
            padding: 25px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: none; /* 默认隐藏 */
        }
        .report-header h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: var(--color-bg-light);
            padding: 20px;
            border-radius: var(--radius-sm);
            text-align: center;
        }
        .summary-card h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: var(--color-text-gray);
        }
        .summary-card p {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            color: var(--color-text-dark);
        }
        .chart-container {
            width: 100%;
            height: 400px;
        }

        /* --- 考勤表精细化样式 --- */
        #attendanceReportContent .table-section {
            overflow-x: auto; /* 允许表格横向滚动 */
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
        }
        #attendanceTable {
            border-collapse: separate; /* 为了让sticky+border生效 */
            border-spacing: 0;
        }
        #attendanceTable th,
        #attendanceTable td {
            padding: 8px 12px;
            text-align: center;
            font-size: 13px;
            border-bottom: 1px solid var(--color-border-light);
        }
        /* 斑马条纹 */
        #attendanceTable tbody tr:nth-child(odd) td {
            background-color: var(--color-bg-light);
        }

        /* --- 冻结列核心样式 --- */
        #attendanceTable th:nth-child(-n+4),
        #attendanceTable td:nth-child(-n+4) {
            position: sticky;
            z-index: 1;
            background-color: var(--color-bg-lighter);
        }
        #attendanceTable th:nth-child(1), #attendanceTable td:nth-child(1) { left: 0; width: 120px; }
        #attendanceTable th:nth-child(2), #attendanceTable td:nth-child(2) { left: 120px; width: 70px; }
        #attendanceTable th:nth-child(3), #attendanceTable td:nth-child(3) { left: 190px; width: 70px; }
        #attendanceTable th:nth-child(4), #attendanceTable td:nth-child(4) { left: 260px; width: 70px; }
        
        /* 冻结列右侧的分隔线 */
        #attendanceTable th:nth-child(4),
        #attendanceTable td:nth-child(4) {
            border-right: 2px solid var(--color-border);
        }

        /* 状态单元格样式 */
        .status-on_duty { color: #0c4a6e; }
        .status-on_leave { color: #713f12; }
        .status-off_duty { color: #4b5563; }
        #attendanceTable td.status-on_duty { background-color: #e0f2fe; }
        #attendanceTable td.status-on_leave { background-color: #fef9c3; }
        #attendanceTable tr:nth-child(odd) td.status-off_duty { background-color: #f3f4f6; }

    </style>
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏导航 (与dashboard一致) -->
        <aside class="sidebar">
            <div class="logo">
                <h2>智慧养老系统</h2>
                <p class="role-badge">管理员</p>
            </div>
            <nav class="nav-menu">
                <a href="admin-dashboard.html" class="nav-item">
                    <span class="icon">📊</span>
                    <span>数据仪表盘</span>
                </a>
                <a href="admin-users.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>用户管理</span>
                </a>
                <a href="admin-elderly.html" class="nav-item">
                    <span class="icon">👴</span>
                    <span>老人信息管理</span>
                </a>
                <a href="admin-schedule.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>医护排班</span>
                </a>
                <a href="admin-leave.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>请假审批</span>
                </a>
                <a href="admin-devices.html" class="nav-item">
                    <span class="icon">📱</span>
                    <span>设备管理</span>
                </a>
                <a href="admin-alerts.html" class="nav-item">
                    <span class="icon">⚠️</span>
                    <span>预警管理</span>
                </a>
                <a href="admin-settings.html" class="nav-item">
                    <span class="icon">⚙️</span>
                    <span>系统设置</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <header class="top-bar">
                <h1>数据报告中心</h1>
                <div class="user-info">
                    <span id="welcomeText">欢迎，管理员！</span>
                </div>
            </header>

            <div class="report-container">
                <!-- 筛选区域 -->
                <div class="report-filters">
                    <div class="form-group">
                        <label for="reportType">报告类型</label>
                        <select id="reportType" class="form-input">
                            <option value="monthly_health">月度健康报告</option>
                            <option value="staff_attendance">医护人员考勤表</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reportMonth">选择月份</label>
                        <input type="month" id="reportMonth" class="form-input">
                    </div>
                    <div id="filterForElderly" class="form-group">
                        <label for="elderlyFilter">选择老人</label>
                        <select id="elderlyFilter" class="form-input">
                            <option value="">全部老人</option>
                        </select>
                    </div>
                    <div id="filterForStaff" class="form-group" style="display: none;">
                        <label for="staffFilter">选择医护人员</label>
                        <select id="staffFilter" class="form-input">
                            <option value="">全部医护</option>
                        </select>
                    </div>
                    <button id="generateReportBtn" class="btn-primary" style="align-self: flex-end;">生成报告</button>
                </div>

                <!-- 健康报告显示区域 -->
                <div id="healthReportContent" class="report-display-area">
                    <div class="report-header">
                        <h2 id="reportTitle">报告标题</h2>
                        <p id="reportSubtitle" class="text-gray">报告生成时间：</p>
                    </div>
                    <hr style="margin: 20px 0;">
                    
                    <h3>核心指标概览</h3>
                    <div id="summaryGrid" class="summary-grid">
                        <!-- 动态生成 -->
                    </div>

                    <h3>心率月度趋势</h3>
                    <div id="heartRateTrendChart" class="chart-container"></div>

                    <h3>血压月度趋势</h3>
                    <div id="bloodPressureTrendChart" class="chart-container"></div>
                </div>

                <!-- 考勤报告显示区域 -->
                <div id="attendanceReportContent" class="report-display-area" style="display: none;">
                    <div class="report-header">
                        <h2 id="attendanceReportTitle">考勤报告标题</h2>
                        <p id="attendanceReportSubtitle" class="text-gray">报告生成时间：</p>
                    </div>
                    <hr style="margin: 20px 0;">
                    <div class="table-section" style="margin: 0; box-shadow: none;">
                        <table class="data-table" id="attendanceTable">
                            <!-- 表头和内容将由JS动态生成 -->
                        </table>
                    </div>
                </div>

                 <div id="reportPlaceholder" style="text-align: center; padding: 50px; color: #888;">
                    <p>请选择筛选条件并点击“生成报告”</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/admin-reports.js"></script>
</body>
</html>
