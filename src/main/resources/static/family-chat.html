<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭群聊 - 智慧养老系统</title>
    <link rel="stylesheet" href="css/pension-variables.css">
    <link rel="stylesheet" href="css/penou-base.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/family-mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .chat-container {
            display: flex;
            height: 80vh;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(106, 142, 173, 0.08);
            overflow: hidden;
        }

        .chat-users {
            width: 250px;
            background: #f7f8fa;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
        }

        .chat-users h3 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            padding: 18px 20px;
            margin: 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            padding: 14px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
            font-size: 15px;
        }

        .user-item.active,
        .user-item:hover {
            background: #e9eafe;
        }
        .user-item {
            position: relative; /* Needed for badge positioning */
        }
        .unread-badge {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #f44336; /* Red */
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 0 6px;
            height: 18px;
            line-height: 18px;
            border-radius: 9px;
            min-width: 18px;
            text-align: center;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .chat-header-content {
            flex: 1;
        }

        .chat-header-title {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
        }

        .chat-header-meta {
            margin-top: 4px;
            font-size: 13px;
            color: #6b7280;
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-back-btn {
            display: none;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            color: #4b5563;
            font-size: 16px;
            cursor: pointer;
        }

        .chat-back-btn:hover {
            background: #e5e7eb;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .message.me {
            align-items: flex-end;
        }

        .message .sender-name {
            font-size: 12px;
            color: #888;
            margin: 0 10px 4px 10px;
        }

        .message.me .sender-name {
            display: none;
        }

        .message .bubble {
            max-width: 60%;
            padding: 12px 18px;
            border-radius: 18px;
            background: #fff;
            color: #333;
            font-size: 15px;
            margin: 0 10px;
            word-break: break-all;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .message.me .bubble {
            background: #667eea;
            color: white;
        }

        .message .meta {
            font-size: 12px;
            color: #aaa;
            margin: 4px 10px 0 10px;
        }

        .chat-input {
            display: flex;
            align-items: center;
            padding: 18px 24px;
            border-top: 1px solid #e5e7eb;
            background: #fff;
        }

        .chat-input textarea, .chat-input input[type="text"] {
            flex: 1;
            resize: none;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 15px;
            min-height: 38px;
            outline: none;
            margin-right: 12px;
        }

        .chat-input button {
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            font-size: 15px;
            cursor: pointer;
            height: 40px;
        }

        .chat-input .btn {
            background: transparent;
            color: #555;
            padding: 0 8px;
            font-size: 20px;
        }
        
        #voice-btn.recording {
            color: #f44336;
        }

        .context-menu {
            display: none;
            position: absolute;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
            border-radius: 5px;
            overflow: hidden;
        }
        .context-menu ul {
            list-style: none;
            margin: 0;
            padding: 5px 0;
        }
        .context-menu li {
            padding: 8px 15px;
            cursor: pointer;
        }

        /* 图片消息样式 - 微信风格 */
        .image-bubble {
            margin: 0 10px;
            max-width: 60%;
        }

        .image-bubble img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 6px;
            cursor: pointer;
            display: block;
        }

        /* 文件消息样式 - 微信风格 */
        .file-bubble {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 180px;
        }

        .file-bubble i {
            color: #576b95;
            font-size: 16px;
        }

        .file-bubble a {
            color: inherit;
            text-decoration: none;
            flex: 1;
            font-size: 14px;
        }

        .file-bubble a:hover {
            text-decoration: underline;
        }

        /* 语音消息样式 - 简洁版 */
        .voice-bubble {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 150px;
            border: none;
            box-shadow: none;
        }

        .voice-bubble i {
            color: #576b95;
            font-size: 16px;
        }

        .voice-bubble audio {
            flex: 1;
            height: 30px;
        }

        .voice-bubble .duration {
            font-size: 12px;
            color: #999;
        }

        /* 未读消息徽章 */
        .unread-badge {
            background: #f44336;
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 12px;
            margin-left: 8px;
            display: none;
        }
        .context-menu li:hover {
            background-color: #f0f0f0;
        }

        /* 右键菜单样式 */
        .context-menu {
            position: absolute;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
            display: none;
            min-width: 80px;
        }

        .context-menu ul {
            list-style: none;
            margin: 0;
            padding: 4px 0;
        }

        .context-menu li {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }

        .context-menu li:hover {
            background-color: #f0f0f0;
        }

        @media (max-width: 900px) {
            .chat-container {
                flex-direction: column;
                height: calc(100vh - 160px);
                max-height: none;
            }

            .chat-users {
                width: 100%;
                height: 100%;
            }

            .chat-main {
                width: 100%;
                height: 100%;
                display: none;
            }

            .chat-container.mobile-chat-active .chat-main {
                display: flex;
            }

            .chat-container.mobile-chat-active .chat-users {
                display: none;
            }

            .chat-container.mobile-chat-active .chat-back-btn {
                display: inline-flex;
            }

            .chat-messages {
                padding: 16px;
            }
        }
    </style>
</head>

<body data-family-nav="chat">
<div class="admin-container">
    <!-- 侧边栏导航 -->
    <aside class="sidebar">
        <div class="logo">
            <h2>智慧养老系统</h2>
            <p class="role-badge">子女端</p>
        </div>
        <nav class="nav-menu">
            <a href="family-dashboard.html" class="nav-item">
                <span class="icon">📊</span>
                <span>家人数据总览</span>
            </a>
            <a href="family-chat.html" class="nav-item active">
                <span class="icon">💬</span>
                <span>沟通通道</span>
            </a>
            <a href="family-location.html" class="nav-item">
                <span class="icon">📍</span>
                <span>GPS定位</span>
            </a>
            <a href="family-services.html" class="nav-item">
                <span class="icon">🏥</span>
                <span>医护服务</span>
            </a>
            <a href="family-me.html" class="nav-item">
                <span class="icon">👤</span>
                <span>账号中心</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <header class="top-bar">
            <h1>家庭群聊</h1>
            <div class="user-info">
                <span id="welcomeText">欢迎！</span>
            </div>
        </header>
        <div class="content-wrapper" style="padding: 20px;">
            <div class="chat-container">
                <div class="chat-users">
                    <h3>老人群组</h3>
                    <div class="user-list" id="userList">
                        <!-- 动态加载群组列表 -->
                    </div>
                </div>
                <div class="chat-main">
                    <div class="chat-header" id="chatHeader">
                        <button type="button" class="chat-back-btn" id="chatBackBtn" aria-label="返回群组" title="返回群组">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div class="chat-header-content" id="chatHeaderContent">请选择一个群组开始聊天</div>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <!-- 聊天消息 -->
                    </div>
                    <div class="chat-input">
                        <button id="file-btn" class="btn" disabled title="发送文件"><i class="fas fa-paperclip"></i></button>
                        <input type="file" id="file-input" style="display: none;">
                        <button id="image-btn" class="btn" disabled title="发送图片"><i class="fas fa-image"></i></button>
                        <input type="file" id="image-input" accept="image/*" style="display: none;">
                        <button id="voice-btn" class="btn" disabled><i class="fas fa-microphone"></i></button>
                        <input type="text" id="chatInput" placeholder="输入消息..." disabled>
                        <button id="sendBtn" disabled>发送</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
        <div id="context-menu" class="context-menu">
        <ul>
            <li id="delete-message">删除</li>
        </ul>
    </div>
    <nav class="bottom-nav" aria-label="移动端主导航">
        <a href="family-dashboard.html" class="bottom-nav-item" data-family-nav="dashboard">
            <span class="icon">📊</span>
            <span>总览</span>
        </a>
        <a href="family-chat.html" class="bottom-nav-item active" data-family-nav="chat">
            <span class="icon">💬</span>
            <span>沟通</span>
        </a>
        <a href="family-location.html" class="bottom-nav-item" data-family-nav="location">
            <span class="icon">📍</span>
            <span>定位</span>
        </a>
        <a href="family-services.html" class="bottom-nav-item" data-family-nav="services">
            <span class="icon">🏥</span>
            <span>服务</span>
        </a>
        <a href="family-me.html" class="bottom-nav-item" data-family-nav="me">
            <span class="icon">👤</span>
            <span>我</span>
        </a>
    </nav>
</div>

<script src="js/common.js"></script>
<script src="js/family-mobile.js"></script>

</body>

</html>
